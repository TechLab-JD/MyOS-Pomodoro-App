<div class="app-window" id="PomodoroApp">
  <div class="app-header">
    <span class="app-title">🍅 Pomodoro</span>
    <div class="app-controls"><button class="minimize-btn">–</button><button class="close-btn">×</button></div>
  </div>
  <div class="app-content">
    <div class="pm">
      <div id="pm-mode" class="pm-mode">Focus</div>
      <div id="pm-time" class="pm-time">25:00</div>
      <div class="pm-btns"><button id="pm-start">Start</button><button id="pm-reset">Reset</button></div>
      <div id="pm-count" class="pm-count">0 focus sessions done</div>
      <div class="pm-set">
        <label>Focus <input id="pm-work" type="number" min="1" value="25"> min</label>
        <label>Break <input id="pm-break" type="number" min="1" value="5"> min</label>
      </div>
    </div>
  </div>
  <div class="resize-handle"></div>
</div>
